services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: careerpath, POSTGRES_USER: careerpath, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-careerpath-dev}"}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U careerpath"], interval: 3s, retries: 20}
  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-careerpath-dev}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      CORS_ORIGINS: http://localhost:5173
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment: {VITE_API_URL: "http://localhost:8000/api"}
    depends_on: [backend]
    ports: ["5173:5173"]
volumes: {pgdata: {}}
