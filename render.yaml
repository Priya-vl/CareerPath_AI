# Render Blueprint: Postgres + Django API. The React site goes on Vercel (see DEPLOY.md).
databases:
  - name: careerpath-db
    plan: free
    databaseName: careerpath
    user: careerpath

services:
  - type: web
    name: careerpath-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /api/pathways
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_data && (python manage.py createsuperuser --noinput || true) && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: careerpath-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_HTTPS
        value: "1"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: FRONTEND_URL          # temporary value; replace with your Vercel URL after step 3 of DEPLOY.md
        value: https://placeholder.example.com
      - key: LLM_PROVIDER
        value: groq
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: LLM_API_KEY           # optional free Groq key; leave empty to skip
        sync: false
